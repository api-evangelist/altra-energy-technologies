name: Altra Energy Technologies
description: >-
  Altra Energy Technologies was a Houston, Texas software company founded in 1996 by Williams and
  PanEnergy (later Duke Energy) that built neutral online trading platforms for the energy sector.
  Its flagship marketplace, Altrade, provided a real-time, anonymous electronic exchange for trading
  natural gas, crude oil, natural gas liquids, and power, backed by energy transaction management
  software spanning deal capture, portfolio monitoring, physical scheduling, and back-office
  reconciliation and settlement. At its peak the platform served more than 6,000 users worldwide.
  The company raised roughly $55.5M from investors including Battery Ventures, Austin Ventures, BP,
  Candescent Partners, and Capital Resource Partners. It ceased to exist as an independent company
  around 2002: its software operations were acquired by Caminus Corporation and its online
  marketplace by ChemConnect (recorded elsewhere as Supply Chain Connect). No live developer portal,
  API, or public developer surface exists for this defunct company.
